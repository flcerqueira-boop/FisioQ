<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FisioQ by OrtoFlix</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NWKJWZLST0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NWKJWZLST0');
    </script>

    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#0B1E3D"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="FisioQ"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png"/>
    <link rel="apple-touch-icon" href="/icon-180.png"/>
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png"/>
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png"/>

    <!-- Verificação de autenticação Fisio+ -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const app = initializeApp({
        apiKey: "AIzaSyDe_7GdbVfwcVeG19lj_4ZkL0zKZaLP68o",
        authDomain: "fisioplus-cd92b.firebaseapp.com",
        projectId: "fisioplus-cd92b",
      }, "fisioplus-auth");

      const auth = getAuth(app);
      const db = getFirestore(app);

      // Mostrar loading enquanto verifica
      document.getElementById('root').innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1E3D;">
          <div style="text-align:center;color:white;font-family:sans-serif;">
            <div style="font-size:32px;margin-bottom:12px;">📋</div>
            <div style="font-size:14px;color:rgba(255,255,255,0.6);">Verificando acesso...</div>
          </div>
        </div>`;

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          // Não logado → redireciona para o Fisio+
          window.location.href = "https://fisiomais.ortoflix.com";
          return;
        }

        // Verifica se usuário está aprovado no Fisio+
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (!userDoc.exists() || userDoc.data().status !== "approved") {
            window.location.href = "https://fisiomais.ortoflix.com";
            return;
          }
        } catch(e) {
          window.location.href = "https://fisiomais.ortoflix.com";
          return;
        }

        // Logado e aprovado → carrega o app normalmente
        document.getElementById('root').innerHTML = '';
        const script = document.createElement('script');
        script.type = 'module';
        script.crossOrigin = true;
        script.src = '/app.js';
        document.head.appendChild(script);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if('serviceWorker' in navigator){
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('SW registered'))
            .catch(e => console.log('SW error:', e));
        });
      }
    </script>
  </body>
</html>
